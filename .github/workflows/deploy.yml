name: Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate application and migrations
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    env:
      CI: "true"
      SKIP_ENV_VALIDATION: "true"
      # Import-time clients require syntactically valid configuration, but the
      # validation suite never connects to these local-only placeholders.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/persona_ci
      AUTH_SECRET: ci-only-auth-secret-that-is-never-used
      MAIL_LOGIN: ci@example.invalid
      MAIL_LOGIN_PASSWORD: ci-only-password
      DIRECTUS_URL: http://127.0.0.1:8055
      DIRECTUS_TOKEN: ci-only-directus-token

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve validated commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment assets
        run: bun run deploy:check

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Validate committed database migrations
        run: bun run db:migrations:check

      - name: Build
        run: bun run build

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      DEPLOY_SHA: ${{ needs.validate.outputs.commit_sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/projects/persona-management' }}

    steps:
      - name: Checkout validated deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"

          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid deployment commit::Expected a full 40-character commit SHA."
            exit 2
          fi
          if ! [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
            [[ "$DEPLOY_REF" == *..* || "$DEPLOY_REF" == */ || "$DEPLOY_REF" == *//* ]]; then
            echo "::error title=Invalid deployment branch::The requested branch contains unsupported characters: $DEPLOY_REF"
            exit 2
          fi
          if ! [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Invalid deployment path::DEPLOY_PATH must be an absolute path without spaces."
            exit 2
          fi

          if ssh -T -i ~/.ssh/id_ed25519 \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_REF='$DEPLOY_REF' DEPLOY_REPO_PATH='$DEPLOY_PATH' bash -s" \
            < deploy/remote-deploy.sh; then
            echo "Deployment of $DEPLOY_SHA completed successfully."
          else
            status=$?
            echo "::error title=Remote deployment failed::The production server exited with status $status. Review the failed grouped step; runtime rollback is automatic after activation failures."
            exit "$status"
          fi
