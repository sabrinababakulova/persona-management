name: Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate application and migrations
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SKIP_ENV_VALIDATION: "true"
      # Import-time clients require syntactically valid configuration, but the
      # validation suite never connects to these local-only placeholders.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/persona_ci
      AUTH_SECRET: ci-only-auth-secret-that-is-never-used
      MAIL_LOGIN: ci@example.invalid
      MAIL_LOGIN_PASSWORD: ci-only-password
      DIRECTUS_URL: http://127.0.0.1:8055
      DIRECTUS_TOKEN: ci-only-directus-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Validate committed database migrations
        run: bun run db:migrations:check

      - name: Build
        run: bun run build

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail

          if ! [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Invalid deployment branch::The requested branch contains unsupported characters: $DEPLOY_REF"
            exit 2
          fi

          ssh -i ~/.ssh/id_ed25519 \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -Eeuo pipefail
             cd /root/projects/persona-management
             if ! git diff --quiet || ! git diff --cached --quiet; then
               echo '::error title=Remote worktree is dirty::Refusing to overwrite uncommitted production-server changes.' >&2
               exit 1
             fi
             git fetch origin '$DEPLOY_REF'
             current_branch=\$(git branch --show-current)
             if [ \"\$current_branch\" != '$DEPLOY_REF' ]; then
               git checkout '$DEPLOY_REF'
             fi
             git pull --ff-only origin '$DEPLOY_REF'
             SOURCE_ALREADY_UPDATED=true \
             DEPLOY_BRANCH='$DEPLOY_REF' \
             APP_NAME=yeshunt \
             DEPLOY_PATH=/root/projects/persona-management \
             DEPLOY_REPOSITORY=origin \
             bash ./scripts/deploy.sh" || {
               status=$?
               echo "::error title=Remote deployment failed::The production server exited with status $status. Review the deployment log above; the application was not restarted after a failed build, backup, or migration."
               exit "$status"
             }
